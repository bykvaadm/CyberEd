# Забираем секрет из Vault и показываем два способа с ним обойтись.
#
# ВАЖНО: keyword `secrets:vault` доступен только в Premium/Ultimate.
# В Community Edition делаем «ручную» аутентификацию: id_tokens (доступен на всех тарифах)
# выдаёт JWT, а vault CLI меняет его на Vault-токен и читает kv.
#
# ПРО MASKED: замаскировать эти значения в логе НЕЛЬЗЯ, и на то две причины:
#   1. Раннер маскирует только то, о чём ему сказал GitLab (CI/CD-переменные с флагом Masked
#      или Premium-keyword `secrets:`). Значения, полученные в рантайме через `vault kv get`,
#      раннеру неизвестны — маскировать ему нечего.
#   2. Требования к маскируемому значению: минимум 8 символов, одна строка, ограниченный
#      набор символов. `ololo` и `azaza` — по 5 символов, они бы и не прошли.
# Вывод: не полагайтесь на маскирование. Просто НЕ ПЕЧАТАЙТЕ секрет — см. job read-secret.

stages:
  - secrets

# ---------------------------------------------------------------------------
# Общая часть: логин в Vault по JWT и чтение секрета.
# Дальше два job'а по-разному обходятся с полученным значением.
# ---------------------------------------------------------------------------
.vault:
  stage: secrets
  # официальный образ vault с CLI; GitLab сам подменяет entrypoint на sh.
  # Версия совпадает с сервером (чарт 0.34.0 ставит Vault 2.0.3).
  image:
    name: hashicorp/vault:2.0.3
    entrypoint: [""]
  variables:
    VAULT_ADDR: "http://vault.vault.svc.cluster.local:8200"
  id_tokens:
    # aud ДОЛЖЕН совпадать с bound_audiences у роли jwt в Vault
    VAULT_ID_TOKEN:
      aud: "http://vault.vault.svc.cluster.local:8200"
  before_script:
    - echo "Логинимся в Vault по JWT (ни пароля, ни secret_id не храним)..."
    - export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role=gitlab jwt=$VAULT_ID_TOKEN)"
    - export keystore="$(vault kv get   -mount=kv -field=keystore   thp/logstash-kube)"
    - export redis="$(vault kv get      -mount=kv -field=redis      thp/logstash-kube)"
    - export truststore="$(vault kv get -mount=kv -field=truststore thp/logstash-kube)"

# ---------------------------------------------------------------------------
# ШАГ 1 — КАК ДЕЛАТЬ НЕЛЬЗЯ.
# Секрет получен правильно (JWT, короткоживущий токен), а дальше просто выброшен
# в лог открытым текстом. Лог job'а видит любой, у кого есть доступ к проекту,
# и он остаётся в GitLab. Это утечка.
# ---------------------------------------------------------------------------
leak-secret:
  extends: .vault
  script:
    # ВНИМАНИЕ: строку целиком берём в одинарные кавычки. Без них YAML увидит внутри
    # ": " (двоеточие+пробел) и распарсит элемент как map, а не как строку —
    # GitLab ответит "script config should be a string or a nested array of strings".
    - 'echo "--- так делать НЕЛЬЗЯ: секрет уходит в лог ---"'
    - echo "keystore=$keystore"
    - echo "redis=$redis"
    - echo "truststore=$truststore"

# ---------------------------------------------------------------------------
# ШАГ 2 — КАК ПРАВИЛЬНО.
# Доказываем, что секрет получен и он именно тот, — не раскрывая значения.
# В реальной работе секрет так и живёт: в переменной окружения, откуда его читает
# приложение, и никогда не попадает в stdout.
# ---------------------------------------------------------------------------
read-secret:
  extends: .vault
  script:
    - 'echo "--- так правильно: значения не печатаем ---"'
    - |
      show() {
        printf '%-11s len=%-3s sha256=%s\n' \
          "$1" "${#2}" "$(printf %s "$2" | sha256sum | cut -c1-12)"
      }
      show keystore   "$keystore"
      show redis      "$redis"
      show truststore "$truststore"
    - echo "секрет получен и доступен приложению через \$keystore / \$redis / \$truststore"
